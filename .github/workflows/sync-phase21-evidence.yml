name: Sync Phase21 verification evidence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-phase21-evidence.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Synchronize durable Phase21 evidence
        shell: bash
        run: |
          python3 <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "TODO.md",
              "The one-time integration runner requires check/unit/build/release/browser gates before committing this checkpoint. Netlify Git linkage, first deploy, actual-host verification, manual/device and field measurements remain UNVERIFIED.",
              "The verified feature commit is `6e1a5e4`; tree-equivalent checkpoint `0de73d3` passed [Validate41250182231](https://github.com/AahPlexX/fc/actions/runs/41250182231): zero registry advisories, lint/typecheck, 115 unit tests, production build, release artifact checks, 14 negative artifact cases, and all 90 Playwright scenarios across Chromium/Firefox/WebKit. Netlify Git linkage, first deploy, actual-host verification, manual/device and field measurements remain UNVERIFIED.",
          )
          replace_once(
              "TODO.md",
              "| 21 | Versioned deployed-update prompt and Netlify handoff | COMPLETE (implementation gate) | `1.0.0` baseline; generated/revalidated version marker; Update/Cancel modal; Netlify build config. Live Netlify Git CD/host verification remains UNVERIFIED. |",
              "| 21 | Versioned deployed-update prompt and Netlify handoff | COMPLETE (automated scope) | `1.0.0` baseline; Validate41250182231 green on tree-equivalent `0de73d3`; 115 unit/90 browser/14 negative artifact cases; live Netlify Git CD/host verification remains UNVERIFIED. |",
          )

          replace_once(
              "docs/verification.md",
              "Phase21 candidate (2026-10-31): OmniConvert establishes `1.0.0` as the canonical release baseline and adds a generated, revalidated `/version.json` plus an accessible Update/Cancel modal for numerically newer deployments. The marker is excluded from service-worker precache and client checks use `cache: \"no-store\"`; Update reloads without forced worker activation. Host-verifier fixtures now include the JSON marker and its MIME/cache contract. The one-time integration runner executes the full pinned check/unit/build/release/browser gate before committing. Netlify project `omniconvert-sfya` is provisioned, but Git linkage, production deployment and live HTTPS verification remain UNVERIFIED.",
              "Phase21 (2026-10-31): OmniConvert establishes `1.0.0` as the canonical release baseline and adds a generated, revalidated `/version.json` plus an accessible Update/Cancel modal for numerically newer deployments. The marker is excluded from service-worker precache and client checks use `cache: \"no-store\"`; Update reloads without forced worker activation. Feature commit `6e1a5e4` was gated before integration; tree-equivalent checkpoint `0de73d3` passed [Validate41250182231](https://github.com/AahPlexX/fc/actions/runs/41250182231): registry audit zero advisories, lint/typecheck, 115 unit tests, production build, release artifact checks, 14 negative artifact cases, and 90/90 Playwright scenarios across Chromium 156, Firefox 157 and WebKit 27.2. The retained `browser-verification` artifact contains 22 files and SHA-256 `dcfa0f8d89e3ca9418c211aecbe00d29121548eef58c73b6589bf65967a9a4e2`. Netlify project `omniconvert-sfya` is provisioned, but Git linkage, production deployment and live HTTPS verification remain UNVERIFIED.",
          )

          handoff = Path("docs/HANDOFF.md")
          text = handoff.read_text(encoding="utf-8")
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          text, count = re.subn(r'^updated_at: ".*"$', f'updated_at: "{now}"', text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise RuntimeError("docs/HANDOFF.md: updated_at anchor missing")
          old = "Phase21 on 2026-10-31 establishes OmniConvert `1.0.0` and the permanent release-version rule: every significant update increments the patch by exactly `0.0.1`. Vite emits `/version.json` from `package.json`; the marker is no-cache, never precached, and checked with `cache: \"no-store\"`. A newer semantic version opens a native Update/Cancel dialog showing the available version. Cancel suppresses that version for the current tab; Update reloads without forcing service-worker activation. `netlify.toml` builds with pnpm and publishes `dist`. Netlify project `omniconvert-sfya` was created, but the available Netlify connector cannot link the GitHub repository, so Git CD, the first deploy and real-host verification remain explicitly open. For Netlify production recovery, fix forward from source rather than restoring an older deploy through an agent/API."
          new = old + " Feature commit `6e1a5e4` is verified by tree-equivalent checkpoint `0de73d3` and green [Validate41250182231](https://github.com/AahPlexX/fc/actions/runs/41250182231): zero registry advisories, lint/typecheck, 115 unit tests, production build/release checks, 14 negative artifact cases, and 90/90 Chromium/Firefox/WebKit scenarios. Retained browser evidence artifact ID is `13060674888`."
          if text.count(old) != 1:
              raise RuntimeError(f"docs/HANDOFF.md: Phase21 anchor count {text.count(old)}")
          handoff.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          rm .github/workflows/sync-phase21-evidence.yml
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record OmniConvert 1.0.0 validation"
          git push origin HEAD:main
