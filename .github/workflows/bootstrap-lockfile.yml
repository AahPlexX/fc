name: Validate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install browser dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Production browser and accessibility tests
        run: pnpm test:e2e

      - name: Initial bundle budget
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {gzipSync} from 'node:zlib';
          const html=readFileSync('dist/index.html','utf8');
          const files=[...html.matchAll(/(?:src|href)="(\/assets\/[^" ]+\.(?:js|css))"/g)].map(match=>'dist'+match[1]);
          const bytes=files.reduce((sum,file)=>sum+gzipSync(readFileSync(file)).length,0);
          if(!files.length||bytes>150000) throw new Error(`Initial bundle exceeds budget: ${bytes}`);
          console.log(`Initial JS/CSS gzip: ${bytes} bytes`);
          JS
