name: Bootstrap lockfile

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/bootstrap-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@12.15.0

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Generate lockfile
        run: pnpm install --lockfile-only

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Commit verified lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git diff --cached --quiet || git commit -m 'chore: add verified pnpm lockfile'
          git push origin HEAD:main

      - name: Upload verified lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
          if-no-files-found: error
