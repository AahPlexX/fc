name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit pinned dependency graph
        run: |
          mkdir -p release-results
          pnpm audit --audit-level=high --json > release-results/dependency-audit.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log("Registry advisory counts:", JSON.parse(readFileSync("release-results/dependency-audit.json", "utf8")).metadata.vulnerabilities)'

      - name: Lint and typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Validate release artifact and bundle budget
        run: pnpm release:check

      - name: Reject malformed release artifacts
        run: pnpm release:test

      - name: Install browser dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Production browser and accessibility tests
        run: pnpm test:e2e

      - name: Retain browser verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, primary release verified 2026-10-25
        with:
          name: browser-verification
          path: |
            test-results/
            release-results/
          if-no-files-found: ignore
          retention-days: 14
