name: Phase22 Live Host Evidence Sync

'on':
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Record live-origin blocker and remove temporary helpers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          RUN_URL = "https://github.com/AahPlexX/fc/actions/runs/41331723293"
          FAILURE = (
              f"Live-origin verification [HostVerify41331723293]({RUN_URL}) rebuilt the clean `1.0.1` artifact and "
              "started checking 36 static artifacts at `https://omniconverttool.netlify.app`, but failed immediately "
              "because the `/` response was larger than the exact built `index.html`. Netlify edge request logs from the "
              "same window show a `/.netlify/scripts/hud?variant=public` request. Current Netlify documentation says the "
              "Powered by Netlify badge is injected into public-project HTML at the edge and can be disabled per project; "
              "that evidence is consistent with the observed mutation, but the failed verifier did not capture an exact "
              "response-body diff, so the badge is not asserted as proven byte-level root cause."
          )
          NEXT = (
              "Environment action: in Netlify open Project configuration > General > Powered by Netlify badge, turn the "
              "badge off, save, then rerun `pnpm release:verify-host -- https://omniconverttool.netlify.app`. Netlify "
              "documents that this setting takes effect on the next request without a redeploy. The connected Netlify "
              "API surface exposed here has no badge-setting action, and the attempted connected UI-control endpoint "
              "failed before navigation, so this account-level toggle was not changed by the agent."
          )

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text missing in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "TODO.md",
              "Netlify production project `omniconverttool` has a ready production deploy `6ae773ecede1a79225dc8053` built from branch `main` at exact checkpoint `84d6ea2e5b57d1dbc312644cf8a114ccada54b09`; Netlify reports 12 header rules processed without errors. Next environment-specific action: run `pnpm release:verify-host -- https://omniconverttool.netlify.app` against the exact release manifest. This full byte/header/MIME/cache/404 contract, manual accessibility/physical-device evaluation, field metrics and broad real-hardware coverage remain UNVERIFIED. Automated browser coverage is strong regression evidence, not proof of identical experience on every physical device or complete WCAG conformance. For a bad published Netlify release, fix forward by reverting/correcting source and redeploying; do not force old clients onto another service worker.",
              f"Netlify production project `omniconverttool` is active on branch `main`; Netlify reports its production deploy ready with 12 header rules processed without errors. {FAILURE} {NEXT} Until that rerun passes, the full live byte/header/MIME/cache/404 contract remains UNVERIFIED. Manual accessibility/physical-device evaluation, current/previous stable-browser certification, field metrics and broad real-hardware coverage also remain UNVERIFIED. Automated browser coverage is strong regression evidence, not proof of identical experience on every physical device or complete WCAG conformance. For a bad published Netlify release, fix forward by reverting/correcting source and redeploying; do not force old clients onto another service worker."
          )
          replace(
              "TODO.md",
              "live host verifier is green; manual/physical-device/stable-browser/field evidence remains open.",
              "live host verifier is blocked by Netlify edge HTML mutation; manual/physical-device/stable-browser/field evidence remains open."
          ) if "live host verifier is green; manual/physical-device/stable-browser/field evidence remains open." in Path("TODO.md").read_text() else None
          replace(
              "TODO.md",
              "full host verifier/manual/physical-device/field evidence remains open.",
              "live host verifier attempted but blocked by edge HTML mutation; manual/physical-device/stable-browser/field evidence remains open."
          ) if "full host verifier/manual/physical-device/field evidence remains open." in Path("TODO.md").read_text() else None

          handoff = Path("docs/HANDOFF.md")
          text = handoff.read_text()
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('updated_at: '):
                  lines[i] = 'updated_at: "2026-11-01T17:29:46Z"'
              elif line.startswith('summary: '):
                  lines[i] = 'summary: "Phase22 1.0.1 responsive hardening is complete for automated scope; Netlify production is active, while the strict live-host byte contract is blocked by an edge-injected HTML overlay and manual/device/field evidence remains separate."'
              elif line.startswith('resume_focus: '):
                  lines[i] = 'resume_focus: "Disable Netlify project Powered by Netlify badge, rerun release:verify-host against https://omniconverttool.netlify.app, then continue product work; keep manual assistive-technology/physical-device, stable-browser and field evidence separate."'
          handoff.write_text("\n".join(lines) + ("\n" if text.endswith("\n") else ""))
          replace(
              "docs/HANDOFF.md",
              "The repository's full `release:verify-host` HTTPS byte/header/MIME/cache/404 contract, physical-device/manual accessibility and field evidence remain explicitly unverified.",
              f"{FAILURE} {NEXT} The full live-host byte/header/MIME/cache/404 contract, physical-device/manual accessibility, current/previous stable-browser certification and field evidence remain explicitly unverified."
          )

          with Path("docs/verification.md").open("a") as f:
              f.write(
                  "\n\n## Phase22 Netlify live-origin attempt — 2026-11-01\n"
                  + FAILURE + " " + NEXT +
                  " The failure occurred before the verifier could certify headers, MIME/cache rules or randomized missing-asset 404s; none of those downstream checks are counted as passed for the real Netlify origin. The strict verifier is intentionally unchanged rather than allowing edge-mutated HTML.\n"
              )

          replace(
              "docs/production.md",
              "The repository's full `release:verify-host` contract has not yet been run against that HTTPS origin, so host byte/header/MIME/cache/404 conformance remains UNVERIFIED.",
              f"{FAILURE} {NEXT} Therefore host byte/header/MIME/cache/404 conformance remains UNVERIFIED."
          )
          replace(
              "docs/production.md",
              "The production Netlify deploy exists and is ready, but the full host-verifier check remains pending in this checkpoint.",
              "The production Netlify deploy exists and is ready, but the full host-verifier check is currently blocked by the edge-mutated root HTML described above. Do not weaken the exact-byte verifier; remove the project-level badge injection and rerun it."
          )
          replace(
              "docs/production.md",
              "Full `release:verify-host` remains required for the live-origin contract; manual physical-device/accessibility and field checks remain explicitly separate.",
              "`release:verify-host` was attempted and failed on edge-mutated root HTML before certification; disable the Netlify Powered by Netlify badge and rerun it. Manual physical-device/accessibility, stable-browser and field checks remain explicitly separate."
          )

          replace(
              "CHANGELOG.md",
              "- Netlify production deploy `6ae773ecede1a79225dc8053` is ready from exact checkpoint `84d6ea2e5b57d1dbc312644cf8a114ccada54b09` with 12 header rules processed; full `release:verify-host` verification remains separate.",
              f"- Netlify production is active from `main`. {FAILURE} {NEXT} The verifier remains strict; the live-host contract is not marked passed."
          )
          PY
          rm .github/workflows/phase22-live-host.yml scripts/phase22-live-host-doc-sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md CHANGELOG.md docs/HANDOFF.md docs/verification.md docs/production.md .github/workflows/phase22-live-host.yml scripts/phase22-live-host-doc-sync.py
          git diff --cached --check
          git commit -m "docs: record Netlify host verification blocker"
          git push origin HEAD:main
