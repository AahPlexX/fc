name: Phase22 Responsive Integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.13.0

      - name: Install pinned pnpm and dependencies
        run: |
          npm install --global pnpm@12.15.0
          pnpm install --frozen-lockfile

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Prove pre-fix text-reflow regression
        shell: bash
        run: |
          pnpm build
          set +e
          pnpm exec playwright test tests/e2e/responsive.spec.ts --project=chromium --grep "200% text size" > phase22-red.log 2>&1
          status=$?
          set -e
          cat phase22-red.log
          test "$status" -ne 0
          grep -q "200% text size" phase22-red.log

      - name: Apply 1.0.1 responsive hardening
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          css_path = Path("src/styles/tokens.css")
          css = css_path.read_text()
          pairs = [
              ("  --workbench-width: clamp(20rem, 94vw, 120rem);", "  --workbench-width: min(94vw, 120rem);"),
              ("body {\n  min-width: 20rem;", "body {\n  min-width: 0;"),
              (".job-actions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--space-1);\n  justify-content: flex-end;\n}\n\n.job-actions button {\n  min-width: 6rem;\n  padding-inline: 0.9rem;\n}", ".job-actions {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(min(100%, 8.5rem), 1fr));\n  gap: var(--space-1);\n}\n\n.job-actions button {\n  width: 100%;\n  min-width: 0;\n  padding-inline: 0.9rem;\n  overflow-wrap: anywhere;\n}"),
              (".metadata-drawer header,\n.preview-modal > header {\n  display: flex;\n  align-items: flex-start;\n  justify-content: space-between;\n  gap: var(--space-2);\n}", ".metadata-drawer header,\n.preview-modal > header {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: flex-start;\n  justify-content: space-between;\n  gap: var(--space-2);\n  min-width: 0;\n}"),
              (".metadata-drawer footer button,\n.preview-modal > header button { min-width: 6rem; padding-inline: 0.85rem; }", ".metadata-drawer footer button,\n.preview-modal > header button { min-width: min(6rem, 100%); max-width: 100%; padding-inline: 0.85rem; overflow-wrap: anywhere; }"),
              (".release-update-modal footer button { min-width: 7rem; }", ".release-update-modal footer button { min-width: min(7rem, 100%); max-width: 100%; overflow-wrap: anywhere; }"),
              (".job-actions { flex-wrap: wrap; gap: var(--space-1); }", ".job-actions { gap: var(--space-1); }"),
          ]
          for old, new in pairs:
              if old not in css:
                  raise SystemExit(f"missing CSS anchor: {old[:80]!r}")
              css = css.replace(old, new, 1)

          control_anchor = "button,\nselect,\ninput[type=\"file\"] {\n  min-height: 2.75rem;\n}\n"
          control_rules = "\nbutton,\nselect,\ninput[type=\"file\"],\ninput[type=\"range\"],\ntextarea {\n  max-inline-size: 100%;\n}\n\nbutton,\n.import-notice,\n.job-progress-copy > :first-child,\n.workbench-footnote {\n  overflow-wrap: anywhere;\n}\n\n.workspace-toolbar > *,\n.aggregate-progress-copy > *,\n.job-progress-copy > *,\n.queue-heading-row > *,\n.job-card-header > * {\n  min-width: 0;\n}\n"
          if control_anchor not in css:
              raise SystemExit("missing control-size anchor")
          css = css.replace(control_anchor, control_anchor + control_rules, 1)

          motion_anchor = "\n@media (prefers-reduced-motion: reduce) {"
          compact_landscape = "\n@media (max-height: 30rem) {\n  .metadata-drawer,\n  .preview-modal,\n  .release-update-modal {\n    max-height: calc(100svh - 0.5rem);\n  }\n\n  .metadata-drawer {\n    height: calc(100svh - 0.5rem);\n  }\n}\n"
          if motion_anchor not in css:
              raise SystemExit("missing reduced-motion anchor")
          css_path.write_text(css.replace(motion_anchor, compact_landscape + motion_anchor, 1))

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          if package.get("version") != "1.0.0":
              raise SystemExit(f"expected 1.0.0, got {package.get('version')}")
          package["version"] = "1.0.1"
          package_path.write_text(json.dumps(package, indent=2) + "\n")
          PY

          cat > tests/e2e/update.spec.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { expect, test } from "@playwright/test";

          const { version: currentVersion } = JSON.parse(
            readFileSync(new URL("../../package.json", import.meta.url), "utf8"),
          ) as { version: string };
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(currentVersion);
          if (!match) throw new Error(`Expected major.minor.patch, received ${currentVersion}`);
          const [, major, minor, patch] = match;
          if (major === undefined || minor === undefined || patch === undefined) {
            throw new Error(`Unable to derive next patch from ${currentVersion}`);
          }
          const newerVersion = `${major}.${minor}.${Number(patch) + 1}`;

          test("announces a newer deployed version and lets the user defer it", async ({ page }) => {
            let requests = 0;
            await page.route("**/version.json", async (route) => {
              requests += 1;
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({ version: newerVersion }),
              });
            });
            await page.goto("/");
            const dialog = page.getByRole("dialog", { name: "Update available" });
            await expect(dialog).toBeVisible();
            await expect(dialog).toContainText(`Version ${newerVersion} is now available.`);
            const cancel = page.getByRole("button", { name: "Cancel" });
            await expect(cancel).toBeFocused();
            await cancel.click();
            await expect(dialog).toBeHidden();
            const before = requests;
            await page.evaluate(() => window.dispatchEvent(new Event("focus")));
            await expect.poll(() => requests).toBeGreaterThan(before);
            await expect(dialog).toBeHidden();
          });

          test("Update reloads and accepts the deployed version after navigation", async ({ page }) => {
            let deployedVersion = newerVersion;
            await page.route("**/version.json", async (route) => {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({ version: deployedVersion }),
              });
            });
            await page.goto("/");
            const dialog = page.getByRole("dialog", { name: "Update available" });
            await expect(dialog).toBeVisible();
            deployedVersion = currentVersion;
            const navigation = page.waitForRequest(
              (request) => request.isNavigationRequest() && new URL(request.url()).pathname === "/",
            );
            await page.getByRole("button", { name: "Update" }).click();
            await navigation;
            await page.waitForLoadState("domcontentloaded");
            await expect(dialog).toBeHidden();
          });

          test("does not announce the current deployed version", async ({ page }) => {
            await page.route("**/version.json", async (route) => {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({ version: currentVersion }),
              });
            });
            await page.goto("/");
            await expect(page.getByRole("dialog", { name: "Update available" })).toBeHidden();
          });
          EOF

      - name: Synchronize Phase22 documentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          docs = ["AGENTS.md", "TODO.md", "CHANGELOG.md", "README.md", "docs/HANDOFF.md", "docs/verification.md", "docs/production.md"]
          for name in docs:
              path = Path(name)
              path.write_text(path.read_text().replace("omniconvert-sfya", "omniconverttool"))

          agents = Path("AGENTS.md")
          text = agents.read_text()
          old = "- UI must remain usable from 320px through 3840px+, keyboard-complete, reduced-motion aware, and WCAG 2.2 AA-oriented."
          new = "- UI must remain device/viewport agnostic: usable without lost information or functionality from 320px through 3840px+, portrait or landscape, keyboard/pointer/touch input, zoom-equivalent narrow viewports, and increased text sizing. Preserve keyboard completion, reduced-motion support, visible focus, >=24 CSS-pixel pointer targets (44px controls where practical), and WCAG 2.2 AA-oriented reflow. Never use device-model sniffing to choose layout."
          if old not in text:
              raise SystemExit("missing AGENTS responsive invariant")
          agents.write_text(text.replace(old, new, 1))

          phase = "## Phase22 device/viewport-agnostic responsive hardening — 2026-10-31\nOmniConvert is now `1.0.1`. A RED-proven regression showed the prior rem-scaled `20rem` page minimum widening a 320 CSS-pixel viewport to 640 CSS pixels at 200% root text size. The implementation binds the workbench to available space, makes job actions container-adaptive, wraps long content/modal headers, bounds modal actions, and improves short-landscape dialog use. `tests/e2e/responsive.spec.ts` covers 320–3840px, portrait/landscape, 200% text sizing, long filenames, visible >=24 CSS-pixel targets, and dialog containment across Chromium/Firefox/WebKit. The update-modal tests now derive current/next patch versions from `package.json` through `node:fs`. Exact live-host and permanent Validate evidence remain separate gates.\n"
          for name in ["TODO.md", "README.md", "docs/HANDOFF.md", "docs/verification.md", "docs/production.md"]:
              path = Path(name)
              path.write_text(path.read_text().rstrip() + "\n\n" + phase)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "## [Unreleased]\n"
          if marker not in text:
              raise SystemExit("missing CHANGELOG Unreleased marker")
          block = "### Device/viewport-agnostic responsive hardening — 2026-10-31\n- Increment OmniConvert to `1.0.1` for this significant client UX update.\n- Remove rem-scaled page minimums that broke reflow under increased text sizing; make actions, long content and dialogs container-safe without device sniffing.\n- Add RED-proven Chromium/Firefox/WebKit responsive coverage from 320–3840px, portrait/landscape, 200% text sizing, long filenames, target sizing and compact-landscape dialogs.\n- Make update-modal browser tests derive current/next patch versions from `package.json` through `node:fs`, avoiding stale hard-coded release fixtures and Node JSON import-attribute coupling.\n\n"
          changelog.write_text(text.replace(marker, marker + block, 1))
          PY

      - name: Audit dependency graph
        run: pnpm audit --audit-level=high

      - name: Lint and typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build and release validation
        run: |
          pnpm build
          pnpm release:check
          pnpm release:test

      - name: Focused responsive matrix
        run: pnpm exec playwright test tests/e2e/responsive.spec.ts

      - name: Full Chromium Firefox WebKit suite
        run: pnpm test:e2e

      - name: Commit validated 1.0.1 implementation
        shell: bash
        run: |
          git config user.name "AahPlexX automation"
          git config user.email "130876266+AahPlexX@users.noreply.github.com"
          git rm .github/workflows/phase22-responsive.yml
          git add package.json src/styles/tokens.css tests/e2e/responsive.spec.ts tests/e2e/update.spec.ts AGENTS.md TODO.md CHANGELOG.md README.md docs/HANDOFF.md docs/verification.md docs/production.md
          git diff --cached --check -- . ':!public/THIRD_PARTY_NOTICES.txt'
          git commit -m "feat: harden device-agnostic responsive UX"
          git push origin HEAD:main
