name: Phase22 Responsive Integration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for RED proof
        run: pnpm exec playwright install --with-deps chromium

      - name: Add responsive regression and prove current source fails it
        shell: bash
        run: |
          cat > tests/e2e/responsive.spec.ts <<'EOF'
          import { expect, test, type Page } from "@playwright/test";

          const expectNoHorizontalOverflow = async (page: Page) => {
            const dimensions = await page.evaluate(() => ({
              innerWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            expect(dimensions.scrollWidth).toBeLessThanOrEqual(dimensions.innerWidth);
          };

          const expectVisibleTargetsUsable = async (page: Page) => {
            const failures = await page.evaluate(() => {
              const selectors = [
                "button",
                "select",
                'input[type="file"]',
                'input[type="range"]',
                ".toggle-control",
                "a[href]",
              ].join(",");
              return Array.from(document.querySelectorAll<HTMLElement>(selectors))
                .map((element) => {
                  const rect = element.getBoundingClientRect();
                  return {
                    label:
                      element.getAttribute("aria-label") ??
                      element.textContent?.trim().slice(0, 80) ??
                      element.tagName,
                    height: rect.height,
                    width: rect.width,
                    left: rect.left,
                    right: rect.right,
                    top: rect.top,
                    bottom: rect.bottom,
                  };
                })
                .filter(
                  (target) =>
                    target.width > 0 &&
                    target.height > 0 &&
                    target.bottom > 0 &&
                    target.top < window.innerHeight &&
                    (target.width < 24 ||
                      target.height < 24 ||
                      target.left < -0.5 ||
                      target.right > window.innerWidth + 0.5),
                );
            });
            expect(failures).toEqual([]);
          };

          test("workspace reflows across compact portrait, landscape, desktop, and 4K viewports", async ({
            page,
          }) => {
            await page.goto("/");
            for (const viewport of [
              { width: 320, height: 568 },
              { width: 568, height: 320 },
              { width: 375, height: 667 },
              { width: 667, height: 375 },
              { width: 768, height: 1024 },
              { width: 1024, height: 768 },
              { width: 1440, height: 900 },
              { width: 1920, height: 1080 },
              { width: 3840, height: 2160 },
            ]) {
              await page.setViewportSize(viewport);
              await expectNoHorizontalOverflow(page);
              await expect(page.getByRole("heading", { name: "OmniConvert", exact: true })).toBeVisible();
              await expect(page.getByRole("heading", { name: "Import files", exact: true })).toBeVisible();
            }
          });

          test("200% text size keeps a 320px workspace, long filename, actions, and preview fully usable", async ({
            page,
          }) => {
            await page.setViewportSize({ width: 320, height: 700 });
            await page.goto("/");
            await page.evaluate(() => {
              document.documentElement.style.fontSize = "32px";
            });
            await expectNoHorizontalOverflow(page);
            await expectVisibleTargetsUsable(page);

            const longName = `${"very-long-local-file-name-".repeat(7)}data.csv`;
            await page.locator('input[type="file"]').setInputFiles({
              name: longName,
              mimeType: "text/csv",
              buffer: Buffer.from("name,value\nAda,42"),
            });
            const card = page.locator(".job-card");
            await expect(card).toBeVisible();
            await expectNoHorizontalOverflow(page);
            await expectVisibleTargetsUsable(page);

            await card.locator("select").selectOption("json");
            await card.getByRole("button", { name: "Convert", exact: true }).click();
            await expect(card).toHaveAttribute("data-status", "completed");
            await expectNoHorizontalOverflow(page);

            await card.getByRole("button", { name: "Preview", exact: true }).click();
            const dialog = page.getByRole("dialog", { name: "Preview" });
            await expect(dialog).toBeVisible();
            const bounds = await dialog.boundingBox();
            expect(bounds).not.toBeNull();
            expect(bounds?.x ?? -1).toBeGreaterThanOrEqual(0);
            expect((bounds?.x ?? 0) + (bounds?.width ?? 0)).toBeLessThanOrEqual(320.5);
            await expectNoHorizontalOverflow(page);
            await expectVisibleTargetsUsable(page);
          });

          test("short landscape viewports keep metadata dialog inside the visual viewport with reachable controls", async ({
            page,
          }) => {
            await page.setViewportSize({ width: 568, height: 256 });
            await page.goto("/");
            await page.locator('input[type="file"]').setInputFiles({
              name: "compact.csv",
              mimeType: "text/csv",
              buffer: Buffer.from("name,value\nAda,42"),
            });
            const card = page.locator(".job-card");
            await expect(card).toBeVisible();
            await card.getByRole("button", { name: /Metadata/ }).click();
            const dialog = page.getByRole("dialog", { name: "Metadata" });
            await expect(dialog).toBeVisible();
            const bounds = await dialog.boundingBox();
            expect(bounds).not.toBeNull();
            expect(bounds?.x ?? -1).toBeGreaterThanOrEqual(0);
            expect(bounds?.y ?? -1).toBeGreaterThanOrEqual(0);
            expect((bounds?.x ?? 0) + (bounds?.width ?? 0)).toBeLessThanOrEqual(568.5);
            expect((bounds?.y ?? 0) + (bounds?.height ?? 0)).toBeLessThanOrEqual(256.5);
            await expectNoHorizontalOverflow(page);
            await expectVisibleTargetsUsable(page);
            await expect(dialog.getByRole("button", { name: /close/i })).toBeVisible();
          });
          EOF

          pnpm build
          set +e
          pnpm exec playwright test tests/e2e/responsive.spec.ts --project=chromium --grep "200% text size" > phase22-red.log 2>&1
          status=$?
          set -e
          cat phase22-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the pre-fix 200% text-size regression to fail, but it passed."
            exit 1
          fi
          grep -q "200% text size" phase22-red.log

      - name: Apply responsive hardening and synchronize implementation documentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          css_path = Path("src/styles/tokens.css")
          css = css_path.read_text()
          replacements = {
              "  --workbench-width: clamp(20rem, 94vw, 120rem);": "  --workbench-width: min(94vw, 120rem);",
              "body {\n  min-width: 20rem;": "body {\n  min-width: 0;",
              ".job-actions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--space-1);\n  justify-content: flex-end;\n}\n\n.job-actions button {\n  min-width: 6rem;\n  padding-inline: 0.9rem;\n}": ".job-actions {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(min(100%, 8.5rem), 1fr));\n  gap: var(--space-1);\n}\n\n.job-actions button {\n  width: 100%;\n  min-width: 0;\n  padding-inline: 0.9rem;\n  overflow-wrap: anywhere;\n}",
              ".metadata-drawer header,\n.preview-modal > header {\n  display: flex;\n  align-items: flex-start;\n  justify-content: space-between;\n  gap: var(--space-2);\n}": ".metadata-drawer header,\n.preview-modal > header {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: flex-start;\n  justify-content: space-between;\n  gap: var(--space-2);\n  min-width: 0;\n}",
              ".metadata-drawer footer button,\n.preview-modal > header button { min-width: 6rem; padding-inline: 0.85rem; }": ".metadata-drawer footer button,\n.preview-modal > header button { min-width: min(6rem, 100%); max-width: 100%; padding-inline: 0.85rem; overflow-wrap: anywhere; }",
              ".release-update-modal footer button { min-width: 7rem; }": ".release-update-modal footer button { min-width: min(7rem, 100%); max-width: 100%; overflow-wrap: anywhere; }",
              ".job-actions { flex-wrap: wrap; gap: var(--space-1); }": ".job-actions { gap: var(--space-1); }",
          }
          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f"Missing CSS anchor: {old[:80]!r}")
              css = css.replace(old, new, 1)

          insert_after = "button,\nselect,\ninput[type=\"file\"] {\n  min-height: 2.75rem;\n}\n"
          addition = """

button,
select,
input[type=\"file\"],
input[type=\"range\"],
textarea {
  max-inline-size: 100%;
}

button,
.import-notice,
.job-progress-copy > :first-child,
.workbench-footnote {
  overflow-wrap: anywhere;
}

.workspace-toolbar > *,
.aggregate-progress-copy > *,
.job-progress-copy > *,
.queue-heading-row > *,
.job-card-header > * {
  min-width: 0;
}
"""
          if insert_after not in css:
              raise SystemExit("Missing control-size insertion anchor")
          css = css.replace(insert_after, insert_after + addition, 1)

          short_landscape = """

@media (max-height: 30rem) {
  .metadata-drawer,
  .preview-modal,
  .release-update-modal {
    max-height: calc(100svh - 0.5rem);
  }

  .metadata-drawer {
    height: calc(100svh - 0.5rem);
  }
}
"""
          reduced_motion_anchor = "\n@media (prefers-reduced-motion: reduce) {"
          if reduced_motion_anchor not in css:
              raise SystemExit("Missing reduced-motion anchor")
          css = css.replace(reduced_motion_anchor, short_landscape + reduced_motion_anchor, 1)
          css_path.write_text(css)

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          if package.get("version") != "1.0.0":
              raise SystemExit(f"Expected package version 1.0.0, got {package.get('version')}")
          package["version"] = "1.0.1"
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          docs = [
              Path("AGENTS.md"), Path("TODO.md"), Path("CHANGELOG.md"), Path("README.md"),
              Path("docs/HANDOFF.md"), Path("docs/verification.md"), Path("docs/production.md"),
          ]
          for path in docs:
              text = path.read_text().replace("omniconvert-sfya", "omniconverttool")
              path.write_text(text)

          agents = Path("AGENTS.md")
          text = agents.read_text()
          old = "- UI must remain usable from 320px through 3840px+, keyboard-complete, reduced-motion aware, and WCAG 2.2 AA-oriented."
          new = "- UI must remain device/viewport agnostic: usable without lost information or functionality from 320px through 3840px+, portrait or landscape, keyboard/pointer/touch input, zoom-equivalent narrow viewports, and increased text sizing. Preserve keyboard completion, reduced-motion support, visible focus, >=24 CSS-pixel pointer targets (44px controls where practical), and WCAG 2.2 AA-oriented reflow. Never use device-model sniffing to choose layout."
          if old not in text:
              raise SystemExit("Missing AGENTS responsive invariant")
          agents.write_text(text.replace(old, new, 1))

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          anchor = "## [Unreleased]\n"
          section = """

### Device/viewport-agnostic responsive hardening — 2026-10-31
- Increment OmniConvert to `1.0.1` for the significant client UX update.
- Remove rem-scaled global minimum widths that caused horizontal overflow when users increased root text size; keep the workbench bounded by available viewport space instead of device assumptions.
- Make job actions container-responsive, wrap long notices/statuses and modal headers safely, constrain modal action widths, and use more of short landscape viewports while preserving native dialog scrolling/focus.
- Add a dedicated three-engine responsive regression suite covering 320px through 3840px, portrait/landscape, 200% text sizing, long filenames, >=24 CSS-pixel visible targets, and short-landscape dialogs. The test is RED-proven against the pre-fix source before implementation.
- Netlify project documentation now uses the renamed production project `omniconverttool`; live host verification is performed after the validated source is deployed.
"""
          if anchor not in text:
              raise SystemExit("Missing changelog anchor")
          changelog.write_text(text.replace(anchor, anchor + section, 1))

          todo = Path("TODO.md")
          text = todo.read_text()
          marker = "## Current checkpoint\n"
          phase22 = """## Current checkpoint
**IMPLEMENTED — Phase22 device/viewport-agnostic responsive hardening, awaiting permanent Validate and live-host verification (2026-10-31).** OmniConvert is now `1.0.1`. The responsive contract no longer couples page minimum width to root `rem` sizing; job actions adapt to their available container, long content wraps without widening the page, modal headers/actions stay bounded, and short landscape dialogs use available safe viewport height. A new `tests/e2e/responsive.spec.ts` regression is RED-proven against the prior `1.0.0` CSS and exercises compact portrait/landscape, 320–3840px widths, 200% root text size, long filenames, visible target sizing, and dialog bounds across Chromium/Firefox/WebKit. The integration gate must pass before this checkpoint is committed; permanent `Validate` and the deployed Netlify host contract remain separate gates.

Next action: confirm the `1.0.1` Netlify deploy for `https://omniconverttool.netlify.app`, run `pnpm release:verify-host -- https://omniconverttool.netlify.app` against the exact clean artifact, then trigger the permanent `Validate` workflow on the synchronized source before marking Phase22 COMPLETE.

### Historical Phase21 checkpoint
"""
          if marker not in text:
              raise SystemExit("Missing TODO current checkpoint")
          text = text.replace(marker, phase22, 1)
          ledger_anchor = "| Handoff/tooling | Ignore outputs, distribution notes, durable handoff | COMPLETE |"
          phase_row = "| 22 | Device/viewport-agnostic responsive hardening | IMPLEMENTED; permanent gate pending | `1.0.1`; RED-proven text-size reflow regression; three-engine responsive suite; live host verification pending. |\n"
          if ledger_anchor not in text:
              raise SystemExit("Missing TODO ledger anchor")
          text = text.replace(ledger_anchor, phase_row + ledger_anchor, 1)
          file_anchor = "## File-creation checkpoint record\n"
          file_note = "Phase22 creates one retained file, `tests/e2e/responsive.spec.ts`; the temporary integration workflow removes itself in the implementation commit, keeping the checkpoint within the three-new-file ceiling. No dependency or ADR is added.\n\n"
          if file_anchor not in text:
              raise SystemExit("Missing TODO file checkpoint anchor")
          text = text.replace(file_anchor, file_anchor + file_note, 1)
          todo.write_text(text)

          readme = Path("README.md")
          text = readme.read_text()
          status_start = text.index("## Status\n") + len("## Status\n")
          status_end = text.index("\nThe complete original user-supplied product brief", status_start)
          status = """

OmniConvert is now version `1.0.1`. Phase22 hardens the client as a device/viewport-agnostic workbench: layout is governed by available space rather than device identity, reflows from 320 CSS pixels through 4K-class viewports in portrait and landscape, remains usable with increased text sizing, preserves >=24 CSS-pixel visible pointer targets (with 44px primary controls where practical), and keeps dialogs/actions bounded on compact landscape screens. A dedicated Chromium/Firefox/WebKit regression suite covers those boundaries. Netlify production is `https://omniconverttool.netlify.app`; the exact deployed artifact is verified separately from the source gate before Phase22 is marked complete.
"""
          readme.write_text(text[:status_start] + status + text[status_end:])

          verification = Path("docs/verification.md")
          text = verification.read_text()
          heading = "# Verification evidence — 2026-10-31\n"
          note = """

Phase22 implementation candidate (`1.0.1`, 2026-10-31): a new responsive E2E regression first fails the prior source at 320 CSS pixels with 200% root text sizing because rem-scaled page minimums widen the document. The fix removes that global rem minimum, makes action/modal wrapping container-safe, and adds compact-landscape bounds. The new suite covers 320–3840px, both orientations, 200% text size, long filenames, visible >=24 CSS-pixel targets, and dialog containment across all three Playwright engines. Official design references rechecked this session: WCAG 2.2 SC 1.4.10 Reflow, 1.3.4 Orientation, 2.5.8 Target Size (Minimum), 2.4.11 Focus Not Obscured (Minimum), plus MDN responsive-design/viewport guidance. Permanent `Validate`, physical-device/manual AT evaluation, and live-host verification remain separate until they are actually run.
"""
          if heading not in text:
              raise SystemExit("Missing verification heading")
          verification.write_text(text.replace(heading, heading + note, 1))

          production = Path("docs/production.md")
          text = production.read_text()
          old = "Updated2026-10-31. This is a portable static-hosting procedure. No production deployment has been performed. Source `b803b24` passed [Validate41149485515](https://github.com/AahPlexX/fc/actions/runs/41149485515); TODO records remaining release criteria and docs/verification.md records measured scope. Artifact checks do not establish legal compliance, full accessibility conformance or field performance."
          new = "Updated 2026-10-31. This is the production static-hosting procedure for `https://omniconverttool.netlify.app`. Netlify Git continuous deployment is connected to `AahPlexX/fc` branch `main`; Phase22 raises the client to `1.0.1`. The exact deployed artifact still requires `release:verify-host` after this source lands, and permanent `Validate` remains a separate source gate. Artifact checks do not establish legal compliance, full accessibility conformance, physical-device/manual assistive-technology coverage, or field performance."
          if old not in text:
              raise SystemExit("Missing production intro anchor")
          production.write_text(text.replace(old, new, 1))

          handoff = Path("docs/HANDOFF.md")
          text = handoff.read_text()
          text = text.replace('updated_at: "2026-10-31T22:59:07Z"', 'updated_at: "2026-11-01T02:30:00Z"', 1)
          text = text.replace('title: "OmniConvert 1.0.0 versioned client update and Netlify handoff"', 'title: "OmniConvert 1.0.1 device-agnostic responsive hardening"', 1)
          text = text.replace('summary: "Phase21 establishes 1.0.0 and a deployed-version Update/Cancel prompt; Netlify project is provisioned, while Git linkage and live-host verification remain open."', 'summary: "Phase22 hardens reflow, text scaling, compact landscape dialogs and action wrapping; source validation and exact live-host verification are the remaining gates."', 1)
          text = text.replace('resume_focus: "Link AahPlexX/fc main to Netlify project omniconverttool, verify the first deploy, then run release:verify-host against the HTTPS production origin."', 'resume_focus: "Verify the deployed OmniConvert 1.0.1 artifact at https://omniconverttool.netlify.app, then pass permanent Validate and synchronize final Phase22 evidence."', 1)
          body_anchor = "Current authority is AGENTS.md, TODO.md, README.md, docs/verification.md and docs/production.md. PRD.md is the unchanged verbatim original brief. Git/CHANGELOG retain older snapshots; previous green CI does not certify newer corrections.\n"
          phase = """

Phase22 (2026-10-31) raises OmniConvert to `1.0.1` and hardens the existing responsive contract rather than adding device-specific layouts. A RED-proven browser regression exposes the prior rem-scaled page minimum at 200% text size on a 320px viewport. The implementation bounds the workbench by available viewport space, uses container-adaptive job actions, wraps long content/modal headers, and improves short-landscape dialog use. New three-engine coverage exercises portrait/landscape, 320–3840px widths, large text, long filenames, target sizing and dialog bounds. Netlify is now named `omniconverttool` and connected to `AahPlexX/fc` main. Live artifact verification and permanent Validate are still pending at this checkpoint; do not infer physical-device/manual accessibility or field-performance certification from lab browser coverage.
"""
          if body_anchor not in text:
              raise SystemExit("Missing handoff body anchor")
          handoff.write_text(text.replace(body_anchor, body_anchor + phase, 1))
          PY

      - name: Audit pinned dependency graph
        run: pnpm audit --audit-level=high

      - name: Lint and typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Validate release artifact and bundle budget
        run: pnpm release:check

      - name: Reject malformed release artifacts
        run: pnpm release:test

      - name: Install all browser dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Focused responsive browser gate
        run: pnpm exec playwright test tests/e2e/responsive.spec.ts

      - name: Full production browser and accessibility gate
        run: pnpm test:e2e

      - name: Commit validated Phase22 implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "AahPlexX automation"
          git config user.email "130876266+AahPlexX@users.noreply.github.com"
          git rm .github/workflows/phase22-responsive.yml
          git add package.json src/styles/tokens.css tests/e2e/responsive.spec.ts AGENTS.md TODO.md CHANGELOG.md README.md docs/HANDOFF.md docs/verification.md docs/production.md
          git diff --cached --check -- . ':!public/THIRD_PARTY_NOTICES.txt'
          git commit -m "feat: harden device-agnostic responsive UX"
          git push origin HEAD:main
          echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Rebuild clean committed artifact
        run: |
          pnpm build
          pnpm release:check

      - name: Wait for Netlify 1.0.1 and verify exact production artifact
        shell: bash
        run: |
          matched=0
          for attempt in $(seq 1 90); do
            body=$(curl -fsS -H 'Cache-Control: no-cache' https://omniconverttool.netlify.app/version.json || true)
            version=$(printf '%s' "$body" | node -e 'let s="";process.stdin.setEncoding("utf8");process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{const v=JSON.parse(s).version;process.stdout.write(typeof v==="string"?v:"")}catch{}})' || true)
            if [ "$version" = "1.0.1" ]; then
              matched=1
              break
            fi
            sleep 5
          done
          if [ "$matched" -ne 1 ]; then
            echo "Netlify did not expose version 1.0.1 within the bounded verification window."
            exit 1
          fi
          pnpm release:verify-host -- https://omniconverttool.netlify.app | tee release-results/production-host.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("release-results/production-host.json","utf8"));if(r.origin!=="https://omniconverttool.netlify.app"||r.artifactRevision!==process.env.IMPLEMENTATION_SHA||r.artifactTrackedDirty!==false||r.loopbackTest!==false){throw new Error("Unexpected production-host verification report")};console.log(r)'

      - name: Record production-host verification in durable documentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json, os

          report = json.loads(Path("release-results/production-host.json").read_text())
          sha = os.environ["IMPLEMENTATION_SHA"]
          verified = report["verifiedAt"]
          assets = report["verifiedAssets"]
          missing = report["missingAssetChecks"]

          todo = Path("TODO.md")
          text = todo.read_text()
          old = "**IMPLEMENTED — Phase22 device/viewport-agnostic responsive hardening, awaiting permanent Validate and live-host verification (2026-10-31).**"
          new = "**HOST VERIFIED — Phase22 device/viewport-agnostic responsive hardening; permanent Validate remains pending (2026-10-31).**"
          if old not in text:
              raise SystemExit("Missing TODO Phase22 status")
          text = text.replace(old, new, 1)
          text = text.replace("Next action: confirm the `1.0.1` Netlify deploy for `https://omniconverttool.netlify.app`, run `pnpm release:verify-host -- https://omniconverttool.netlify.app` against the exact clean artifact, then trigger the permanent `Validate` workflow on the synchronized source before marking Phase22 COMPLETE.", f"Production host verification passed at `{verified}` against clean implementation `{sha}`: `{assets}` distributable assets matched byte-for-byte with required security/MIME/cache headers and `{missing}` generated missing-asset paths returned real 404s. Next action: trigger permanent `Validate` on the synchronized source before marking Phase22 COMPLETE.", 1)
          text = text.replace("| 22 | Device/viewport-agnostic responsive hardening | IMPLEMENTED; permanent gate pending | `1.0.1`; RED-proven text-size reflow regression; three-engine responsive suite; live host verification pending. |", f"| 22 | Device/viewport-agnostic responsive hardening | HOST VERIFIED; permanent gate pending | `1.0.1`; RED-proven text-size reflow regression; three-engine responsive suite; Netlify host verified for {assets} assets + {missing} real-404 probes. |", 1)
          todo.write_text(text)

          verification = Path("docs/verification.md")
          text = verification.read_text()
          anchor = "Phase22 implementation candidate (`1.0.1`, 2026-10-31):"
          if anchor not in text:
              raise SystemExit("Missing verification Phase22 anchor")
          insertion = f"Phase22 live-host result: `{verified}` verified `https://omniconverttool.netlify.app` against clean implementation `{sha}` with `{assets}` distributable artifact hashes/lengths, required CSP/security/MIME/cache behavior, and `{missing}` generated missing-asset 404 checks. The report records `artifactTrackedDirty=false` and `loopbackTest=false`. This closes the prior actual-host contract gap for this artifact; rollback drills, physical devices/manual assistive technology, field CWV and native corresponding-source coverage remain separate.\n\n"
          verification.write_text(text.replace(anchor, insertion + anchor, 1))

          production = Path("docs/production.md")
          text = production.read_text()
          old = "The exact deployed artifact still requires `release:verify-host` after this source lands, and permanent `Validate` remains a separate source gate."
          new = f"`release:verify-host` passed at `{verified}` against clean implementation `{sha}` with `{assets}` exact distributable assets and `{missing}` real-404 probes; permanent `Validate` remains a separate source gate."
          if old not in text:
              raise SystemExit("Missing production pending-host anchor")
          production.write_text(text.replace(old, new, 1))

          handoff = Path("docs/HANDOFF.md")
          text = handoff.read_text()
          text = text.replace('summary: "Phase22 hardens reflow, text scaling, compact landscape dialogs and action wrapping; source validation and exact live-host verification are the remaining gates."', 'summary: "Phase22 hardens reflow, text scaling, compact landscape dialogs and action wrapping; exact Netlify artifact verification passed and permanent Validate is the remaining source gate."', 1)
          text = text.replace('resume_focus: "Verify the deployed OmniConvert 1.0.1 artifact at https://omniconverttool.netlify.app, then pass permanent Validate and synchronize final Phase22 evidence."', 'resume_focus: "Trigger permanent Validate for the synchronized 1.0.1 source, then mark Phase22 COMPLETE and record the run ID without changing runtime behavior."', 1)
          text = text.replace("Live artifact verification and permanent Validate are still pending at this checkpoint;", f"Exact live artifact verification passed at `{verified}` for clean implementation `{sha}` ({assets} assets plus {missing} real-404 probes); permanent Validate is still pending at this checkpoint;", 1)
          handoff.write_text(text)

          readme = Path("README.md")
          text = readme.read_text()
          old = "Netlify production is `https://omniconverttool.netlify.app`; the exact deployed artifact is verified separately from the source gate before Phase22 is marked complete."
          new = f"Netlify production is `https://omniconverttool.netlify.app`; the exact `1.0.1` artifact passed deployed-host verification at `{verified}` ({assets} assets plus {missing} real-404 probes). Permanent source validation remains the final Phase22 gate."
          if old not in text:
              raise SystemExit("Missing README host anchor")
          readme.write_text(text.replace(old, new, 1))

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          old = "- Netlify project documentation now uses the renamed production project `omniconverttool`; live host verification is performed after the validated source is deployed."
          new = f"- Netlify project documentation now uses the renamed production project `omniconverttool`; deployed-host verification passed at `{verified}` for clean implementation `{sha}` across {assets} exact assets plus {missing} generated real-404 probes."
          if old not in text:
              raise SystemExit("Missing changelog host anchor")
          changelog.write_text(text.replace(old, new, 1))
          PY
          git add TODO.md CHANGELOG.md README.md docs/HANDOFF.md docs/verification.md docs/production.md
          git diff --cached --check
          git commit -m "docs: record OmniConvert 1.0.1 production verification"
          git push origin HEAD:main
          echo "DOCS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final state summary
        run: |
          echo "Phase22 implementation: $IMPLEMENTATION_SHA"
          echo "Phase22 host/docs checkpoint: $DOCS_SHA"
          cat release-results/production-host.json
