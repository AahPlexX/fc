name: Phase22 Documentation Sync

'on':
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Synchronize Phase22 durable documentation
        run: |
          python scripts/phase22-doc-sync.py
          rm .github/workflows/phase22-doc-sync.yml scripts/phase22-doc-sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md TODO.md CHANGELOG.md docs/HANDOFF.md docs/verification.md docs/production.md .github/workflows/phase22-doc-sync.yml scripts/phase22-doc-sync.py
          git diff --cached --check
          git commit -m "docs: promote Phase22 responsive checkpoint"
          git push origin HEAD:main
