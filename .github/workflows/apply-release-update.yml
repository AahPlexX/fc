name: Apply OmniConvert release update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-release-update.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage OmniConvert 1.0.0 update'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply versioned update prompt and hosting configuration
        shell: bash
        run: |
          python3 <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:80]!r}")
              write(path, value.replace(old, new, 1))

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          if package.get("version") != "0.1.0":
              raise RuntimeError(f"Unexpected starting package version: {package.get('version')!r}")
          package["version"] = "1.0.0"
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")

          replace_once(".gitignore", "release-results/\n", "release-results/\n.netlify/\n")

          write("netlify.toml", '''[build]
          command = "pnpm build"
          publish = "dist"
          ''')

          replace_once(
              "vite.config.ts",
              'const require = createRequire(import.meta.url);\n',
              '''const require = createRequire(import.meta.url);
          const repositoryRoot = dirname(fileURLToPath(import.meta.url));
          const appVersion = (
          \tJSON.parse(readFileSync(join(repositoryRoot, "package.json"), "utf8")) as {
          \t\tversion?: unknown;
          \t}
          ).version;
          if (typeof appVersion !== "string" || !/^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$/.test(appVersion)) {
          \tthrow new Error("package.json version must be an exact major.minor.patch release");
          }
          ''',
          )
          replace_once(
              "vite.config.ts",
              '''\tconst publicDirectory = join(
          \t\tdirname(fileURLToPath(import.meta.url)),
          \t\t"public",
          \t);''',
              '''\tconst publicDirectory = join(repositoryRoot, "public");''',
          )
          replace_once(
              "vite.config.ts",
              '''\tpathname === "/sw.js" ||
          \tpathname === "/manifest.webmanifest" ||''',
              '''\tpathname === "/sw.js" ||
          \tpathname === "/version.json" ||
          \tpathname === "/manifest.webmanifest" ||''',
          )
          replace_once(
              "vite.config.ts",
              '''\t\t\t"/sw.js",
          \t\t\t"/manifest.webmanifest",''',
              '''\t\t\t"/sw.js",
          \t\t\t"/version.json",
          \t\t\t"/manifest.webmanifest",''',
          )
          replace_once(
              "vite.config.ts",
              '''\t\t\tthis.emitFile({
          \t\t\t\ttype: "asset",
          \t\t\t\tfileName: "sources.html",
          \t\t\t\tsource: sourcesIndex(exifReaderArchive.version),
          \t\t\t});
          \t\t\tconst hash = createHash("sha256");''',
              '''\t\t\tthis.emitFile({
          \t\t\t\ttype: "asset",
          \t\t\t\tfileName: "sources.html",
          \t\t\t\tsource: sourcesIndex(exifReaderArchive.version),
          \t\t\t});
          \t\t\tthis.emitFile({
          \t\t\t\ttype: "asset",
          \t\t\t\tfileName: "version.json",
          \t\t\t\tsource: `${JSON.stringify({ version: appVersion })}\\n`,
          \t\t\t});
          \t\t\tconst hash = createHash("sha256");''',
          )
          replace_once(
              "vite.config.ts",
              '''export default defineConfig({
          \tplugins: [react(), ffmpegAssetsPlugin()],''',
              '''export default defineConfig({
          \tdefine: {
          \t\t__OMNICONVERT_VERSION__: JSON.stringify(appVersion),
          \t},
          \tplugins: [react(), ffmpegAssetsPlugin()],''',
          )

          app_marker = '''const configurable = (job: ConversionJob) =>
          \t["QUEUED", "FAILED", "CANCELLED"].includes(job.status);
          export const App = () => {'''
          app_replacement = '''const configurable = (job: ConversionJob) =>
          \t["QUEUED", "FAILED", "CANCELLED"].includes(job.status);

          declare const __OMNICONVERT_VERSION__: string;

          const VERSION_PATTERN = /^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$/;
          const compareVersions = (left: string, right: string): number => {
          \tconst leftParts = left.split(".").map(Number);
          \tconst rightParts = right.split(".").map(Number);
          \tfor (let index = 0; index < 3; index++) {
          \t\tconst difference = (leftParts[index] ?? 0) - (rightParts[index] ?? 0);
          \t\tif (difference !== 0) return difference;
          \t}
          \treturn 0;
          };

          const ReleaseUpdateModal = () => {
          \tconst dialogRef = useRef<HTMLDialogElement>(null);
          \tconst cancelRef = useRef<HTMLButtonElement>(null);
          \tconst dismissedVersion = useRef<string | null>(null);
          \tconst [availableVersion, setAvailableVersion] = useState<string | null>(null);

          \tconst checkForUpdate = useCallback(async () => {
          \t\tif (!import.meta.env.PROD) return;
          \t\ttry {
          \t\t\tconst response = await fetch("/version.json", {
          \t\t\t\tcache: "no-store",
          \t\t\t\tcredentials: "same-origin",
          \t\t\t\theaders: { Accept: "application/json" },
          \t\t\t});
          \t\t\tif (!response.ok) return;
          \t\t\tconst contentType = response.headers
          \t\t\t\t.get("content-type")
          \t\t\t\t?.split(";", 1)[0]
          \t\t\t\t?.trim()
          \t\t\t\t.toLowerCase();
          \t\t\tif (contentType !== "application/json") return;
          \t\t\tconst payload = (await response.json()) as { version?: unknown };
          \t\t\tconst version = payload.version;
          \t\t\tif (typeof version !== "string" || !VERSION_PATTERN.test(version)) return;
          \t\t\tif (
          \t\t\t\tcompareVersions(version, __OMNICONVERT_VERSION__) <= 0 ||
          \t\t\t\tdismissedVersion.current === version
          \t\t\t) {
          \t\t\t\treturn;
          \t\t\t}
          \t\t\tsetAvailableVersion((current) => (current === version ? current : version));
          \t\t\tif ("serviceWorker" in navigator) {
          \t\t\t\tvoid navigator.serviceWorker
          \t\t\t\t\t.getRegistration("/")
          \t\t\t\t\t.then((registration) => registration?.update())
          \t\t\t\t\t.catch(() => undefined);
          \t\t\t}
          \t\t} catch {
          \t\t\t// Version discovery is an enhancement and must never block conversion.
          \t\t}
          \t}, []);

          \tuseEffect(() => {
          \t\tif (!import.meta.env.PROD) return;
          \t\tvoid checkForUpdate();
          \t\tconst interval = window.setInterval(() => void checkForUpdate(), 60_000);
          \t\tconst onFocus = () => void checkForUpdate();
          \t\tconst onOnline = () => void checkForUpdate();
          \t\tconst onVisibilityChange = () => {
          \t\t\tif (document.visibilityState === "visible") void checkForUpdate();
          \t\t};
          \t\twindow.addEventListener("focus", onFocus);
          \t\twindow.addEventListener("online", onOnline);
          \t\tdocument.addEventListener("visibilitychange", onVisibilityChange);
          \t\treturn () => {
          \t\t\twindow.clearInterval(interval);
          \t\t\twindow.removeEventListener("focus", onFocus);
          \t\t\twindow.removeEventListener("online", onOnline);
          \t\t\tdocument.removeEventListener("visibilitychange", onVisibilityChange);
          \t\t};
          \t}, [checkForUpdate]);

          \tuseEffect(() => {
          \t\tconst dialog = dialogRef.current;
          \t\tif (!dialog) return;
          \t\tif (availableVersion && !dialog.open) {
          \t\t\tdialog.showModal();
          \t\t\trequestAnimationFrame(() => cancelRef.current?.focus());
          \t\t}
          \t}, [availableVersion]);

          \tconst dismiss = useCallback(() => {
          \t\tif (availableVersion) dismissedVersion.current = availableVersion;
          \t\tsetAvailableVersion(null);
          \t}, [availableVersion]);

          \treturn (
          \t\t<dialog
          \t\t\tref={dialogRef}
          \t\t\tclassName="release-update-modal"
          \t\t\taria-labelledby="release-update-title"
          \t\t\taria-describedby="release-update-description"
          \t\t\tonClose={dismiss}
          \t\t\tonCancel={(event) => {
          \t\t\t\tevent.preventDefault();
          \t\t\t\tdialogRef.current?.close();
          \t\t\t}}
          \t\t>
          \t\t\t<h2 id="release-update-title">Update available</h2>
          \t\t\t<p className="release-update-version">
          \t\t\t\tVersion {availableVersion ?? __OMNICONVERT_VERSION__} is now available.
          \t\t\t</p>
          \t\t\t<p id="release-update-description">
          \t\t\t\tUpdating reloads OmniConvert. Finish or download any in-memory files you
          \t\t\t\twant to keep before continuing.
          \t\t\t</p>
          \t\t\t<footer>
          \t\t\t\t<button
          \t\t\t\t\tref={cancelRef}
          \t\t\t\t\ttype="button"
          \t\t\t\t\tonClick={() => dialogRef.current?.close()}
          \t\t\t\t>
          \t\t\t\t\tCancel
          \t\t\t\t</button>
          \t\t\t\t<button
          \t\t\t\t\tclassName="primary-action"
          \t\t\t\t\ttype="button"
          \t\t\t\t\tonClick={() => window.location.reload()}
          \t\t\t\t>
          \t\t\t\t\tUpdate
          \t\t\t\t</button>
          \t\t\t</footer>
          \t\t</dialog>
          \t);
          };

          export const App = () => {'''
          replace_once("src/App.tsx", app_marker, app_replacement)
          replace_once(
              "src/App.tsx",
              '''\t\t\t<MetadataDrawer
          \t\t\t\tjob={jobs.find((j) => j.id === metadataId) ?? null}''',
              '''\t\t\t<ReleaseUpdateModal />
          \t\t\t<MetadataDrawer
          \t\t\t\tjob={jobs.find((j) => j.id === metadataId) ?? null}''',
          )

          replace_once(
              "src/styles/tokens.css",
              '''.preview-modal {
            width: min(72rem, calc(100vw - 1rem));''',
              '''.release-update-modal {
            width: min(32rem, calc(100vw - 1rem));
            max-height: 90svh;
            margin: auto;
            padding: var(--space-3);
            overflow: auto;
          }
          .release-update-modal h2 { margin-block-end: var(--space-1); }
          .release-update-version { font-weight: 800; }
          .release-update-modal footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: var(--space-1);
            margin-block-start: var(--space-3);
          }
          .release-update-modal footer button { min-width: 7rem; }

          .preview-modal {
            width: min(72rem, calc(100vw - 1rem));''',
          )
          replace_once(
              "src/styles/tokens.css",
              '''  .metadata-drawer,
            .preview-modal { padding: var(--space-2); }
          }''',
              '''  .metadata-drawer,
            .preview-modal,
            .release-update-modal { padding: var(--space-2); }
            .release-update-modal footer { display: grid; }
            .release-update-modal footer button { width: 100%; }
          }''',
          )

          replace_once(
              "scripts/check-release.mjs",
              '''\t\t\tif (path.startsWith("/engines/") || path.endsWith(".wasm"))
          \t\t\t\tfail(`Heavy engine must not be precached: ${path}`);''',
              '''\t\t\tif (path.startsWith("/engines/") || path.endsWith(".wasm"))
          \t\t\t\tfail(`Heavy engine must not be precached: ${path}`);
          \t\t\tif (path === "/version.json")
          \t\t\t\tfail("Version discovery marker must not be precached");''',
          )
          replace_once(
              "scripts/check-release.mjs",
              '''\tconst icon = requiredArtifact("icon.svg");
          \tif (icon && !text(icon).includes("<svg")) fail("dist/icon.svg is not an SVG document");''',
              '''\tconst icon = requiredArtifact("icon.svg");
          \tif (icon && !text(icon).includes("<svg")) fail("dist/icon.svg is not an SVG document");
          \tconst versionPath = requiredArtifact("version.json");
          \tif (versionPath) {
          \t\ttry {
          \t\t\tconst payload = JSON.parse(text(versionPath));
          \t\t\tconst packageVersion = JSON.parse(text(join(root, "package.json"))).version;
          \t\t\tif (!/^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$/.test(packageVersion ?? ""))
          \t\t\t\tfail("package.json version must be an exact major.minor.patch release");
          \t\t\tif (payload?.version !== packageVersion)
          \t\t\t\tfail(`dist/version.json version ${payload?.version ?? "<missing>"} does not match package.json ${packageVersion}`);
          \t\t} catch (error) {
          \t\t\tfail(`Invalid dist/version.json: ${error.message}`);
          \t\t}
          \t}''',
          )
          replace_once(
              "scripts/check-release.mjs",
              '''\t\tfor (const path of ["/", "/index.html", "/sw.js", "/manifest.webmanifest", "/icon.svg", "/engines/*", "/sources.html", "/THIRD_PARTY_NOTICES.txt"])''',
              '''\t\tfor (const path of ["/", "/index.html", "/sw.js", "/version.json", "/manifest.webmanifest", "/icon.svg", "/engines/*", "/sources.html", "/THIRD_PARTY_NOTICES.txt"])''',
          )

          replace_once(
              "scripts/verify-host.mjs",
              '''\tcss: /^text\\/css$/,
          \twasm: /^application\\/wasm$/,''',
              '''\tcss: /^text\\/css$/,
          \tjson: /^application\\/json$/,
          \twasm: /^application\\/wasm$/,''',
          )
          replace_once(
              "scripts/verify-host.mjs",
              '''\tfor (const path of ["_headers", "index.html", "sw.js", "manifest.webmanifest", "icon.svg", "sources.html", "THIRD_PARTY_NOTICES.txt"])''',
              '''\tfor (const path of ["_headers", "index.html", "sw.js", "version.json", "manifest.webmanifest", "icon.svg", "sources.html", "THIRD_PARTY_NOTICES.txt"])''',
          )
          replace_once(
              "scripts/verify-host.mjs",
              '''\tconst revalidate = ["/", "/index.html", "/sw.js", "/manifest.webmanifest", "/icon.svg", "/sources.html", "/THIRD_PARTY_NOTICES.txt"].includes(path) || path.startsWith("/engines/");''',
              '''\tconst revalidate = ["/", "/index.html", "/sw.js", "/version.json", "/manifest.webmanifest", "/icon.svg", "/sources.html", "/THIRD_PARTY_NOTICES.txt"].includes(path) || path.startsWith("/engines/");''',
          )

          replace_once(
              "tests/unit/hostVerification.test.ts",
              '''\t\t"sw.js": "/* worker */",
          \t\t"manifest.webmanifest": '{"name":"Fixture"}', ''',
              '''\t\t"sw.js": "/* worker */",
          \t\t"version.json": '{"version":"1.0.0"}',
          \t\t"manifest.webmanifest": '{"name":"Fixture"}', ''',
          )
          replace_once(
              "tests/unit/hostVerification.test.ts",
              '''\t\t\tcss: "text/css",
          \t\t\twasm: "application/wasm",''',
              '''\t\t\tcss: "text/css",
          \t\t\tjson: "application/json",
          \t\t\twasm: "application/wasm",''',
          )
          replace_once(
              "tests/unit/hostVerification.test.ts",
              '''\t\texpect(report.verifiedAssets).toBe(13);''',
              '''\t\texpect(report.verifiedAssets).toBe(14);''',
          )

          write("tests/e2e/update.spec.ts", '''import { expect, test } from "@playwright/test";

          const currentVersion = "1.0.0";

          test("announces a newer deployed version and lets the user defer it", async ({ page }) => {
          \tlet requests = 0;
          \tawait page.route("**/version.json", async (route) => {
          \t\trequests += 1;
          \t\tawait route.fulfill({
          \t\t\tstatus: 200,
          \t\t\tcontentType: "application/json",
          \t\t\tbody: JSON.stringify({ version: "1.0.1" }),
          \t\t});
          \t});

          \tawait page.goto("/");
          \tconst dialog = page.getByRole("dialog", { name: "Update available" });
          \tawait expect(dialog).toBeVisible();
          \tawait expect(dialog).toContainText("Version 1.0.1 is now available.");
          \tconst cancel = page.getByRole("button", { name: "Cancel" });
          \tawait expect(cancel).toBeFocused();
          \tawait cancel.click();
          \tawait expect(dialog).toBeHidden();

          \tawait page.evaluate(() => window.dispatchEvent(new Event("focus")));
          \tawait expect.poll(() => requests).toBeGreaterThan(1);
          \tawait expect(dialog).toBeHidden();
          });

          test("Update reloads and accepts the deployed version after navigation", async ({ page }) => {
          \tlet deployedVersion = "1.0.1";
          \tawait page.route("**/version.json", async (route) => {
          \t\tawait route.fulfill({
          \t\t\tstatus: 200,
          \t\t\tcontentType: "application/json",
          \t\t\tbody: JSON.stringify({ version: deployedVersion }),
          \t\t});
          \t});

          \tawait page.goto("/");
          \tconst dialog = page.getByRole("dialog", { name: "Update available" });
          \tawait expect(dialog).toBeVisible();
          \tdeployedVersion = currentVersion;
          \tconst navigation = page.waitForRequest(
          \t\t(request) => request.isNavigationRequest() && new URL(request.url()).pathname === "/",
          \t);
          \tawait page.getByRole("button", { name: "Update" }).click();
          \tawait navigation;
          \tawait page.waitForLoadState("domcontentloaded");
          \tawait expect(dialog).toBeHidden();
          });

          test("does not announce the current deployed version", async ({ page }) => {
          \tawait page.route("**/version.json", async (route) => {
          \t\tawait route.fulfill({
          \t\t\tstatus: 200,
          \t\t\tcontentType: "application/json",
          \t\t\tbody: JSON.stringify({ version: currentVersion }),
          \t\t});
          \t});
          \tawait page.goto("/");
          \tawait expect(page.getByRole("dialog", { name: "Update available" })).toBeHidden();
          });
          ''')

          replace_once(
              "CHANGELOG.md",
              "## [Unreleased]\n\n",
              '''## [Unreleased]

          ### Versioned client update prompt and Netlify hosting — 2026-10-31
          - Establish OmniConvert `1.0.0` as the canonical release baseline. Future significant updates must increment the patch component by exactly `0.0.1` before release.
          - Production builds emit a non-pre-cached, revalidated `/version.json` from `package.json`. Open clients check it without HTTP-cache reuse and show a native modal only for a newer release, with `Update` and `Cancel` actions and the available version number.
          - `Cancel` preserves the current in-memory session and suppresses that same version until the page is reloaded; `Update` reloads without `skipWaiting` or forced service-worker activation.
          - Add Netlify static build configuration (`pnpm build` -> `dist`) and ignore local `.netlify/` state. Netlify project `omniconvert-sfya` is provisioned; Git repository linkage and the first live deploy remain environment-side verification work.

          ''',
          )

          replace_once(
              "AGENTS.md",
              "## Architecture guardrails\n",
              '''## Release version and client-update invariant (2026-10-31)
          - `package.json` is the canonical application version. The official baseline is `1.0.0`.
          - Every significant user-facing/runtime/release update increments the patch component by exactly `0.0.1` (`1.0.0` -> `1.0.1` -> `1.0.2`) before the production build. Do not silently skip or reuse a significant-release version.
          - Vite emits `/version.json` from that package version and compiles the same version into the client. Never hand-edit generated `dist/version.json`.
          - `/version.json` must remain `no-cache`, excluded from service-worker precache, and fetched by the client with `cache: "no-store"`. A numerically newer version may open the Update/Cancel modal; same/older/malformed values do not.
          - `Cancel` preserves the current tab and suppresses only that discovered version for the tab session. `Update` reloads the document; never add `skipWaiting()` or forced activation to implement this prompt.
          - The update modal shows the available version but no release-description requirement. Preserve native-modal keyboard/focus behavior and the in-memory-file warning.
          - Preferred production hosting is Netlify at the origin root. `netlify.toml` builds with pnpm and publishes `dist`; do not add an SPA catch-all because missing JS/WASM paths must remain real 404 responses.

          ## Architecture guardrails
          ''',
          )

          replace_once(
              "TODO.md",
              "## Current checkpoint\n",
              '''## Current checkpoint
          **COMPLETE — Phase21 versioned deployed-update prompt and Netlify handoff, implementation gate (2026-10-31).** OmniConvert officially starts at `1.0.0`. Production builds generate `/version.json` from the canonical package version; it is revalidated, never precached, and checked by open clients with `cache: "no-store"`. A numerically newer release opens an accessible native modal showing the available version with `Update` and `Cancel`. Cancel preserves the current in-memory session and suppresses the same discovered version until reload; Update reloads without forcing service-worker activation. Netlify project `omniconvert-sfya` is provisioned and `netlify.toml` defines `pnpm build` -> `dist`. The one-time integration runner requires check/unit/build/release/browser gates before committing this checkpoint. Netlify Git linkage, first deploy, actual-host verification, manual/device and field measurements remain UNVERIFIED.

          Next environment-specific action: link `AahPlexX/fc` branch `main` to Netlify project `omniconvert-sfya`, let Git continuous deployment publish the verified artifact, then run `pnpm release:verify-host -- https://<production-origin>` against the exact release manifest. For a bad published Netlify release, fix forward by reverting/correcting the source and redeploying; do not force old clients onto another service worker.

          ### Historical Phase20 checkpoint
          ''',
          )
          replace_once(
              "TODO.md",
              '''| 20 | Tabular record preservation and worker cleanup | COMPLETE (automated scope) |115 unit/81 browser/14 negative artifact cases; Validate41149485515 green on b803b24. |
          | Handoff/tooling |''',
              '''| 20 | Tabular record preservation and worker cleanup | COMPLETE (automated scope) |115 unit/81 browser/14 negative artifact cases; Validate41149485515 green on b803b24. |
          | 21 | Versioned deployed-update prompt and Netlify handoff | COMPLETE (implementation gate) | `1.0.0` baseline; generated/revalidated version marker; Update/Cancel modal; Netlify build config. Live Netlify Git CD/host verification remains UNVERIFIED. |
          | Handoff/tooling |''',
          )
          replace_once(
              "TODO.md",
              "## File-creation checkpoint record\n",
              '''## File-creation checkpoint record
          Phase21 creates `netlify.toml` and `tests/e2e/update.spec.ts`; its temporary one-time integration workflow is removed by the verified commit, keeping the checkpoint within the three-new-file ceiling. No ADR or dependency was added.

          ''',
          )

          readme = read("README.md")
          status_start = readme.index("## Status\n\n") + len("## Status\n\n")
          status_end = readme.index("\n\nThe complete original user-supplied product brief", status_start)
          new_status = '''OmniConvert is now version `1.0.0`. Phase21 adds a deployment-aware client update prompt: production builds publish a revalidated `/version.json`, open clients check for a numerically newer release without reusing the HTTP cache, and a native modal offers `Update` or `Cancel` while showing the available version. The prompt preserves the existing waiting service-worker lifecycle—there is no forced activation—and warns before a reload can discard in-memory files. Netlify is the preferred root-origin host; project `omniconvert-sfya` has been provisioned and repository configuration builds with `pnpm build` and publishes `dist`. Git linkage, the first Netlify deploy, and actual-host verification remain UNVERIFIED until the environment-side connection is completed.'''
          write("README.md", readme[:status_start] + new_status + readme[status_end:])

          production = read("docs/production.md")
          production = production.replace(
              "Serve only `dist/`, at the origin root `/`, over HTTPS. Vite preview is a local verification server. Deployment under a subpath is unsupported. There is no backend, authentication or secret configuration.",
              "Preferred production host: Netlify project `omniconvert-sfya`. The project has been provisioned, while Git linkage and its first production deploy remain UNVERIFIED from the available integration surface. `netlify.toml` intentionally contains only the static build contract (`pnpm build`, publish `dist`); no SPA catch-all is added because OmniConvert requires genuine 404 responses for missing JS/WASM assets. Serve only `dist/`, at the origin root `/`, over HTTPS. Vite preview is a local verification server. Deployment under a subpath is unsupported. There is no backend, authentication or secret configuration.",
              1,
          )
          if "Preferred production host: Netlify project" not in production:
              raise RuntimeError("docs/production.md hosting insertion failed")
          production = production.replace(
              "- Revalidate `/`, `/index.html`, `/sw.js`, `/sources.html`, `/THIRD_PARTY_NOTICES.txt`, the manifest/icon and `/engines/*` using `Cache-Control: no-cache`.",
              "- Revalidate `/`, `/index.html`, `/sw.js`, `/version.json`, `/sources.html`, `/THIRD_PARTY_NOTICES.txt`, the manifest/icon and `/engines/*` using `Cache-Control: no-cache`. `/version.json` is generated from the canonical `package.json` version, is excluded from service-worker precache, and is the client update-discovery marker.",
              1,
          )
          if "client update-discovery marker" not in production:
              raise RuntimeError("docs/production.md cache insertion failed")
          production = production.replace(
              "## Deploy, update and roll back\n\n",
              '''## Deploy, update and recover

          OmniConvert starts at version `1.0.0`. Every significant release increments the patch component by exactly `0.0.1` before building. Open clients poll the revalidated version marker on startup, periodically, and when focus/connectivity returns. A newer marker opens the version-only Update/Cancel modal. Cancel leaves the current memory-resident jobs intact for that tab; Update reloads the document and may discard undownloaded in-memory work. The client may ask the service-worker registration to check for an update, but it does not call `skipWaiting()` or otherwise force activation.

          On Netlify, Git continuous deployment should publish the complete `dist` snapshot atomically after the repository is linked. For a bad published Netlify deploy, fix forward: revert or correct the source on `main` and let Git CD publish the corrected artifact. Do not use an agent/API restore or forced service-worker switch as a substitute for a verified source correction. Retain old fingerprinted/versioned assets long enough for open clients to finish their sessions.

          ''',
              1,
          )
          if "## Deploy, update and recover" not in production:
              raise RuntimeError("docs/production.md deploy section insertion failed")
          production = production.replace(
              "Rollback restores the complete prior artifact and its headers/notice materials atomically, retaining newer assets while their clients remain open. Deploy the prior `sw.js` with revalidation enabled; normal lifecycle rules still apply. Avoid deleting all origin storage or forcing reloads during conversion: that can discard queued files and completed outputs. Test the prior shell and a local conversion after rollback. This procedure is prepared but has not been exercised against a real hosting target.\n\n",
              "If a non-Netlify host uses an independently verified artifact-recovery mechanism, it must still preserve complete matching headers/notices and retained versioned assets. OmniConvert's preferred Netlify path is source-level fix-forward. Avoid deleting origin storage or forcing reloads during conversion: that can discard queued files and completed outputs. This procedure has not yet been exercised against the newly provisioned live hosting target.\n\n",
              1,
          )
          write("docs/production.md", production)

          verification = read("docs/verification.md")
          title_end = verification.index("\n\n") + 2
          phase21 = '''Phase21 candidate (2026-10-31): OmniConvert establishes `1.0.0` as the canonical release baseline and adds a generated, revalidated `/version.json` plus an accessible Update/Cancel modal for numerically newer deployments. The marker is excluded from service-worker precache and client checks use `cache: "no-store"`; Update reloads without forced worker activation. Host-verifier fixtures now include the JSON marker and its MIME/cache contract. The one-time integration runner executes the full pinned check/unit/build/release/browser gate before committing. Netlify project `omniconvert-sfya` is provisioned, but Git linkage, production deployment and live HTTPS verification remain UNVERIFIED.

'''
          write("docs/verification.md", verification[:title_end] + phase21 + verification[title_end:])

          handoff = read("docs/HANDOFF.md")
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          handoff = re.sub(r'^updated_at: ".*"$', f'updated_at: "{now}"', handoff, count=1, flags=re.MULTILINE)
          handoff = re.sub(r'^title: ".*"$', 'title: "OmniConvert 1.0.0 versioned client update and Netlify handoff"', handoff, count=1, flags=re.MULTILINE)
