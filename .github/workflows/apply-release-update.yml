          handoff = re.sub(r'^resume_focus: ".*"$', 'resume_focus: "Link AahPlexX/fc main to Netlify project omniconvert-sfya, verify the first deploy, then run release:verify-host against the HTTPS production origin."', handoff, count=1, flags=re.MULTILINE)
          authority = "Current authority is AGENTS.md, TODO.md, README.md, docs/verification.md and docs/production.md. PRD.md is the unchanged verbatim original brief. Git/CHANGELOG retain older snapshots; previous green CI does not certify newer corrections.\n\n"
          phase21_handoff = '''Phase21 on 2026-10-31 establishes OmniConvert `1.0.0` and the permanent release-version rule: every significant update increments the patch by exactly `0.0.1`. Vite emits `/version.json` from `package.json`; the marker is no-cache, never precached, and checked with `cache: "no-store"`. A newer semantic version opens a native Update/Cancel dialog showing the available version. Cancel suppresses that version for the current tab; Update reloads without forcing service-worker activation. `netlify.toml` builds with pnpm and publishes `dist`. Netlify project `omniconvert-sfya` was created, but the available Netlify connector cannot link the GitHub repository, so Git CD, the first deploy and real-host verification remain explicitly open. For Netlify production recovery, fix forward from source rather than restoring an older deploy through an agent/API.

'''
          if authority not in handoff:
              raise RuntimeError("docs/HANDOFF.md authority anchor missing")
          handoff = handoff.replace(authority, authority + phase21_handoff, 1)
          write("docs/HANDOFF.md", handoff)
          PY

      - name: Lint and typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Validate release artifact and bundle budget
        run: pnpm release:check

      - name: Reject malformed release artifacts
        run: pnpm release:test

      - name: Install browser dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Production browser and accessibility tests
        run: pnpm test:e2e

      - name: Commit verified candidate
        shell: bash
        run: |
          rm .github/workflows/apply-release-update.yml
          git add -A
          git diff --cached --check -- . ':(exclude)public/THIRD_PARTY_NOTICES.txt'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add deployed-version update prompt"
          git push origin HEAD:main
