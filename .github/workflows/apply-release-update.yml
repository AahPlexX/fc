name: Apply OmniConvert release update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-release-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 4

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recover and apply the staged candidate
        shell: bash
        run: |
          git show cc7d3ba86f5d61efce3747983b9babe5d694ba5e:.github/workflows/apply-release-update.yml > /tmp/staged-workflow.yml
          python3 <<'PY'
          from pathlib import Path

          workflow = Path("/tmp/staged-workflow.yml").read_text(encoding="utf-8")
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"

          old_if = r'\t\t\tif (path.startsWith("/engines/") || path.endsWith(".wasm"))'
          new_if = r'\t\t\t\tif (path.startsWith("/engines/") || path.endsWith(".wasm"))'
          old_fail = r'\t\t\t\tfail(`Heavy engine must not be precached: ${path}`);'
          new_fail = r'\t\t\t\t\tfail(`Heavy engine must not be precached: ${path}`);'
          if script.count(old_if) != 2 or script.count(old_fail) != 2:
              raise RuntimeError("release-check staged anchor count changed")
          script = script.replace(old_if, new_if).replace(old_fail, new_fail)
          Path("/tmp/apply-release-update.py").write_text(script, encoding="utf-8")

          fixture = Path("tests/unit/hostVerification.test.ts")
          text = fixture.read_text(encoding="utf-8")
          old = '\t\t"manifest.webmanifest": \'{"name":"Fixture"}\',\n'
          if text.count(old) != 1:
              raise RuntimeError("host fixture manifest anchor changed")
          fixture.write_text(text.replace(old, old[:-1] + " \n", 1), encoding="utf-8")
          PY
          python3 /tmp/apply-release-update.py
          python3 <<'PY'
          from pathlib import Path
          fixture = Path("tests/unit/hostVerification.test.ts")
          text = fixture.read_text(encoding="utf-8")
          old = 'expect(JSON.parse(result.out).verifiedAssets).toBe(13);'
          if text.count(old) != 1:
              raise RuntimeError(f"expected one remaining host-verifier artifact assertion, found {text.count(old)}")
          fixture.write_text(text.replace(old, 'expect(JSON.parse(result.out).verifiedAssets).toBe(14);', 1), encoding="utf-8")
          PY
          sed -i 's/[[:space:]]\+$//' tests/unit/hostVerification.test.ts

      - name: Audit pinned dependency graph
        run: pnpm audit --audit-level=high

      - name: Lint and typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Validate release artifact and bundle budget
        run: pnpm release:check

      - name: Reject malformed release artifacts
        run: pnpm release:test

      - name: Install browser dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Production browser and accessibility tests
        run: pnpm test:e2e

      - name: Commit verified candidate
        shell: bash
        run: |
          rm .github/workflows/apply-release-update.yml
          git add -A
          git diff --cached --check -- . ':(exclude)public/THIRD_PARTY_NOTICES.txt'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add deployed-version update prompt"
          git push origin HEAD:main
